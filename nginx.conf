# Runs as an unprivileged user on port 8080 (see Dockerfile).
server_tokens off;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Only serve what a static site needs
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }

  client_max_body_size 1k;
  autoindex off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json font/woff2;

  # ---- Security headers (apply to every response) ----
  set $csp "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
  add_header Content-Security-Policy $csp always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  # Hidden files (.git, .env, ...) are never served
  location ~ /\. { deny all; return 404; }

  # Hashed build assets never change: cache for a year.
  # (add_header inside a location replaces the server-level ones, so repeat them)
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    try_files $uri $uri/ $uri.html =404;
  }
}
